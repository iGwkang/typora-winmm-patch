name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build winmm.dll
        shell: cmd
        run: dll\build.bat

      - name: Show SHA-256
        shell: pwsh
        run: |
          Get-FileHash patch\winmm.dll -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmm-dll
          path: patch/winmm.dll
